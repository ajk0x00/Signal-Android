name: Build Release APK

# Builds a signed release APK on every push to main (and on demand).
#
# Required repository secret:
#   CLOUD_STORAGE_CONFIG    Full contents of app/src/main/assets/cloud_storage_config.json
#                           (the GCS service-account JSON). This file is gitignored, so it
#                           must be injected here at build time.
#
# Optional signing secrets (if all are present the APK is signed with the "debug"
# signingConfig that the release buildType reuses; otherwise an unsigned APK is built):
#   SIGNING_KEYSTORE_BASE64 base64 of the keystore file (`base64 -w0 my.keystore`)
#   SIGNING_STORE_PASSWORD  keystore password
#   SIGNING_KEY_ALIAS       key alias
#   SIGNING_KEY_PASSWORD    key password

on:
  push:
    branches:
      - 'main'
  workflow_dispatch:

permissions:
  contents: read # to fetch code (actions/checkout)

jobs:
  build:
    runs-on: ubuntu-latest-8-cores

    # Mapped to env so it can be referenced in step-level `if:` conditions
    # (the `secrets` context is not available directly in `if:`).
    env:
      SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          submodules: true

      - name: Set up JDK 17
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Validate Gradle Wrapper
        uses: gradle/actions/wrapper-validation@50e97c2cd7a37755bbfafc9c5b7cafaece252f6e # v6

      - name: Write cloud_storage_config.json
        env:
          CLOUD_STORAGE_CONFIG: ${{ secrets.CLOUD_STORAGE_CONFIG }}
        run: |
          if [ -z "$CLOUD_STORAGE_CONFIG" ]; then
            echo "::error::CLOUD_STORAGE_CONFIG secret is not set. Add it under Settings > Secrets and variables > Actions."
            exit 1
          fi
          mkdir -p app/src/main/assets
          printf '%s' "$CLOUD_STORAGE_CONFIG" > app/src/main/assets/cloud_storage_config.json
          # Sanity check: must be valid JSON before we feed it to the build.
          python3 -c "import json,sys; json.load(open('app/src/main/assets/cloud_storage_config.json'))" \
            || { echo "::error::CLOUD_STORAGE_CONFIG is not valid JSON"; exit 1; }
          echo "cloud_storage_config.json written ($(wc -c < app/src/main/assets/cloud_storage_config.json) bytes)"

      - name: Configure release signing
        if: ${{ env.SIGNING_KEYSTORE_BASE64 != '' }}
        env:
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          echo "$SIGNING_KEYSTORE_BASE64" | base64 -d > signing.keystore
          # storeFile is resolved relative to the project root by app/build.gradle.kts
          cat > keystore.debug.properties <<EOF
          storeFile=signing.keystore
          storePassword=$SIGNING_STORE_PASSWORD
          keyAlias=$SIGNING_KEY_ALIAS
          keyPassword=$SIGNING_KEY_PASSWORD
          EOF
          echo "Release signing configured."

      - name: Warn if signing not configured
        if: ${{ env.SIGNING_KEYSTORE_BASE64 == '' }}
        run: echo "::warning::No SIGNING_KEYSTORE_BASE64 secret found — building an UNSIGNED release APK."

      - name: Build release APK
        run: ./gradlew :Signal-Android:assemblePlayProdRelease --no-daemon

      - name: Upload release APK
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: signal-playProd-release-apk
          path: app/build/outputs/apk/playProd/release/*.apk
          if-no-files-found: error

      - name: Archive reports for failed build
        if: ${{ failure() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: reports
          path: '*/build/reports'
