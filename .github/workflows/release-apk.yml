name: Build Release APK

on:
  push:
    branches:
      - main
  release:
    types: [published, created]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: true
          lfs: true

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Validate Gradle Wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Inject Cloud Storage Config
        env:
          CONFIG_JSON: ${{ secrets.CLOUD_STORAGE_CONFIG_JSON }}
          CONFIG_BASE64: ${{ secrets.CLOUD_STORAGE_CONFIG_BASE64 }}
        run: |
          mkdir -p app/src/main/assets
          if [ -n "$CONFIG_BASE64" ]; then
            echo "$CONFIG_BASE64" | base64 --decode > app/src/main/assets/cloud_storage_config.json
            echo "Injected cloud_storage_config.json from base64 secret."
          elif [ -n "$CONFIG_JSON" ]; then
            echo "$CONFIG_JSON" > app/src/main/assets/cloud_storage_config.json
            echo "Injected cloud_storage_config.json from json secret."
          else
            echo "::warning::Neither CLOUD_STORAGE_CONFIG_JSON nor CLOUD_STORAGE_CONFIG_BASE64 secret was found."
          fi

      - name: Inject Keystore and Signing Config
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.KEYSTORE_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEYSTORE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEYSTORE_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > release.keystore
            cat <<EOF > keystore.debug.properties
storeFile=release.keystore
storePassword=$STORE_PASSWORD
keyAlias=$KEY_ALIAS
keyPassword=$KEY_PASSWORD
EOF
            echo "Keystore and signing properties successfully configured."
          else
            echo "::warning::KEYSTORE_BASE64 secret not found, using default debug keystore."
          fi

      - name: Build Release APKs
        run: |
          ./gradlew \
            --write-verification-metadata sha256 \
            assembleWebsiteProdRelease \
            -Dcom.android.tools.r8.deterministicdebugging=false \
            --parallel \
            --build-cache \
            -x test \
            -x lint \
            -x ktlintCheck \
            -x validateScreenshots \
            --no-configuration-cache

      - name: Determine Release Tag
        id: release_info
        run: |
          if [ -n "${{ github.event.release.tag_name }}" ]; then
            TAG="${{ github.event.release.tag_name }}"
          else
            VERSION=$(grep "val canonicalVersionName" app/build.gradle.kts | head -n 1 | cut -d'"' -f2)
            TAG="v${VERSION}"
          fi
          echo "tag=${TAG}" >> $GITHUB_OUTPUT

      - name: Create or Upload to GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.release_info.outputs.tag }}"
          echo "Publishing release for tag: $TAG"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG exists. Uploading assets..."
            gh release upload "$TAG" app/build/outputs/apk/websiteProd/release/*.apk --clobber
          else
            echo "Release $TAG does not exist. Creating release..."
            gh release create "$TAG" app/build/outputs/apk/websiteProd/release/*.apk \
              --title "$TAG" \
              --generate-notes
          fi

      - name: Upload APKs as Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: signal-website-release-apks
          path: app/build/outputs/apk/websiteProd/release/*.apk
