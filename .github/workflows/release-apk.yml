name: Build Release APK

on:
  push:
    branches:
      - main
  release:
    types: [published, created]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: true
          lfs: true

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Validate Gradle Wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Release APKs
        run: |
          ./gradlew \
            --write-verification-metadata sha256 \
            assembleWebsiteProdRelease \
            -Dcom.android.tools.r8.deterministicdebugging=false \
            --parallel \
            --build-cache \
            -x test \
            -x lint \
            -x ktlintCheck \
            -x validateScreenshots \
            --no-configuration-cache

      - name: Determine Release Tag
        id: release_info
        run: |
          if [ -n "${{ github.event.release.tag_name }}" ]; then
            TAG="${{ github.event.release.tag_name }}"
          else
            VERSION=$(grep "val canonicalVersionName" app/build.gradle.kts | head -n 1 | cut -d'"' -f2)
            TAG="v${VERSION}"
          fi
          echo "tag=${TAG}" >> $GITHUB_OUTPUT

      - name: Create or Upload to GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.release_info.outputs.tag }}"
          echo "Publishing release for tag: $TAG"
          gh release create "$TAG" app/build/outputs/apk/websiteProd/release/*.apk \
            --title "$TAG" \
            --generate-notes \
            --clobber || \
          gh release upload "$TAG" app/build/outputs/apk/websiteProd/release/*.apk --clobber

      - name: Upload APKs as Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: signal-website-release-apks
          path: app/build/outputs/apk/websiteProd/release/*.apk
