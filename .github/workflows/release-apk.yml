name: Build Release APK

on:
  release:
    types: [published, created]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: true
          lfs: true

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Release APKs
        run: ./gradlew assemblePlayProdRelease assembleWebsiteProdRelease --no-configuration-cache

      - name: Upload APKs to Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ github.event.release.tag_name }}" app/build/outputs/apk/playProd/release/*.apk --clobber || true
          gh release upload "${{ github.event.release.tag_name }}" app/build/outputs/apk/websiteProd/release/*.apk --clobber || true
