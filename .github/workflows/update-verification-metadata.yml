name: Update Verification Metadata

on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to update verification metadata on'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  update-metadata:
    name: Update Verification Metadata
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.branch != '' && github.event.inputs.branch || github.ref }}
          submodules: true
          lfs: true

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Update Verification Metadata
        run: ./gradlew updateVerificationMetadata

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add gradle/verification-metadata.xml
          if git diff --staged --quiet; then
            echo "No changes in gradle/verification-metadata.xml to commit."
          else
            git commit -m "Update dependency verification metadata [skip ci]"
            git push
          fi
